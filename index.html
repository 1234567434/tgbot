<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>T-Team Meme Studio</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Мощный векторный Canvas-движок Fabric.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #121212; color: #fff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background: #1e1e1e; padding: 10px; text-align: center; font-weight: bold; color: #00FFCC; font-size: 14px; border-bottom: 1px solid #333; }
    #canvas-container { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; position: relative; }
    #tools { background: #181818; padding: 12px; display: flex; gap: 8px; overflow-x: auto; border-top: 1px solid #333; align-items: center; }
    button, label.btn { background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; }
    button.accent { background: #00FFCC; color: #000; border: none; }
    button.danger { background: #ff4757; color: #fff; border: none; }
    input[type=file] { display: none; }
    input[type=color] { border: none; width: 30px; height: 30px; border-radius: 50%; background: none; cursor: pointer; }
  </style>
</head>
<body>
  <header>🎨 T-Team Meme Studio</header>
  
  <div id="canvas-container">
    <canvas id="c"></canvas>
  </div>

  <div id="tools">
    <label class="btn" for="file-input">📷 Выбрать фото</label>
    <input type="file" id="file-input" accept="image/*"/>
    <button onclick="addText()">💬 Добавить текст</button>
    <input type="color" id="color-picker" value="#ffffff" onchange="changeColor(this.value)"/>
    <button onclick="addEmoji('🐱')">🐱</button>
    <button onclick="addEmoji('🔥')">🔥</button>
    <button onclick="addEmoji('🕶️')">🕶️</button>
    <button class="danger" onclick="deleteSelected()">🗑️ Удалить</button>
    <button class="accent" onclick="saveImage()">💾 Сохранить</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready(); tg.expand();

    // Инициализация Canvas
    const canvas = new fabric.Canvas('c', {
      preserveObjectStacking: true
    });

    function resizeCanvas(w, h) {
      const maxW = window.innerWidth;
      const maxH = window.innerHeight - 110; // Вычитаем шапку и панель
      let scale = Math.min(maxW / w, maxH / h);
      canvas.setWidth(w * scale);
      canvas.setHeight(h * scale);
      canvas.setZoom(scale);
    }

    // Автозагрузка фонового фото
    const params = new URLSearchParams(location.search);
    const imgUrl = params.get("img");

    function loadBackground(url) {
      fabric.Image.fromURL(url, function(img) {
        resizeCanvas(img.width, img.height);
        canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas));
      }, { crossOrigin: 'anonymous' });
    }

    if (imgUrl) {
      loadBackground(imgUrl);
    } else {
      loadBackground("https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=600");
    }

    // Загрузка с устройства
    document.getElementById('file-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(f) {
          loadBackground(f.target.result);
        };
        reader.readAsDataURL(file);
      }
    });

    // Добавление интерактивного текста (Двойной клик меняет текст!)
    function addText() {
      const text = new fabric.IText('ВВЕДИТЕ ТЕКСТ', {
        left: canvas.width / 2 - 50,
        top: 50,
        fontFamily: 'Impact, sans-serif',
        fill: document.getElementById('color-picker').value,
        stroke: '#000000',
        strokeWidth: 2,
        fontSize: 40,
        cornerColor: '#00FFCC',
        cornerSize: 12,
        transparentCorners: false
      });
      canvas.add(text);
      canvas.setActiveObject(text);
    }

    // Изменение цвета выбранного текста
    function changeColor(color) {
      const active = canvas.getActiveObject();
      if (active && active.type === 'i-text') {
        active.set('fill', color);
        canvas.renderAll();
      }
    }

    // Добавление эмодзи
    function addEmoji(e) {
      const emoji = new fabric.Text(e, {
        left: canvas.width / 2,
        top: canvas.height / 2,
        fontSize: 60
      });
      canvas.add(emoji);
      canvas.setActiveObject(emoji);
    }

    // Удаление выбранного элемента
    function deleteSelected() {
      const active = canvas.getActiveObject();
      if (active) {
        canvas.remove(active);
      }
    }

    // Сохранение готового мема
    function saveImage() {
      canvas.discardActiveObject();
      canvas.renderAll();
      const dataURL = canvas.toDataURL({
        format: 'png',
        quality: 1
      });
      
      const link = document.createElement('a');
      link.download = 'cat_meme.png';
      link.href = dataURL;
      link.click();
      
      tg.showAlert("Мем сохранен на устройство! 🐱");
    }
  </script>
</body>
</html>
