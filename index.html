<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-Team Meme Editor</title>
    <!-- Скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Библиотека мощного фоторедактора -->
    <script src="https://scaleflex.cloudimg.io/v7/plugins/filerobot-image-editor/latest/filerobot-image-editor.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100vh; background: #121212; }
        #editor_container { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="editor_container"></div>

    <script>
        // Инициализируем Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        // Получаем ссылку на картинку кота, которую бот передал в URL
        const urlParams = new URLSearchParams(window.location.search);
        const imageUrl = urlParams.get('img') || 'https://via.placeholder.com/500x500.png?text=No+Image';

        // Запускаем фоторедактор
        const { TABS, TOOLS } = FilerobotImageEditor;
        const config = {
            source: imageUrl,
            onSave: (editedImageObject, designState) => {
                // Когда юзер нажимает "Сохранить", мы можем отправить картинку обратно в бота!
                // Для простоты здесь мы просто скачиваем её юзеру на телефон
                const link = document.createElement('a');
                link.download = 'meme_cat.png';
                link.href = editedImageObject.imageBase64;
                link.click();
                
                tg.showAlert("Мем сохранен на твое устройство!");
            },
            annotationsCommon: {
                fill: '#ff0000'
            },
            Text: { text: 'ТВОЙ ТЕКСТ ЗДЕСЬ' },
            tabsIds: [TABS.ANNOTATE, TABS.ADJUST, TABS.WATERMARK], 
            defaultTabId: TABS.ANNOTATE,
            defaultToolId: TOOLS.TEXT
        };

        const imageEditor = new FilerobotImageEditor(
            document.querySelector('#editor_container'),
            config
        );

        imageEditor.render();
    </script>
</body>
</html>
